  <rect x="120" width="120" height="72" fill="#2563eb"/>
  <rect x="240" width="120" height="72" fill="#16a34a"/>
  <rect x="360" width="120" height="72" fill="#d97706"/>
  <rect x="480" width="120" height="72" fill="#dc2626"/>
  <rect x="600" width="120" height="72" fill="#f8fafc"/>
